<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semla Engine — Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0b12;
        color: #e8e8f0;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;

      canvas {
        background: #15151f;
        image-rendering: pixelated;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
        max-width: 100vw;
        max-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="960" height="540"></canvas>
    </div>
    <script type="module" src="/src/index.ts"></script>

</html>
